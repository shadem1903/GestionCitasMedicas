<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión!</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css" />
</head>
<body>

<div class="left">
  <svg id="scene" viewBox="0 0 390 470" width="390" height="470"
       xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
    <defs>
      <clipPath id="clip-org">
        <rect x="-10" y="282" width="240" height="210"/>
      </clipPath>
    </defs>

    <g id="g-orange">
      <circle cx="92" cy="458" r="178" fill="#FF6830" clip-path="url(#clip-org)"/>
      <circle cx="50"  cy="357" r="12" fill="rgba(0,0,0,.12)"/>
      <circle id="o-l" cx="50"  cy="357" r="6"  fill="#bf4415"/>
      <circle cx="96"  cy="347" r="12" fill="rgba(0,0,0,.12)"/>
      <circle id="o-r" cx="96"  cy="347" r="6"  fill="#bf4415"/>
      <path d="M56 374 Q80 392 107 374" stroke="#bf4415" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>

    <g id="g-purple">
      <rect x="38" y="38" width="165" height="282" rx="20" fill="#7C4DFF"/>
      <ellipse cx="96"  cy="164" rx="21" ry="15" fill="white" opacity=".9"/>
      <circle id="p-l" cx="96"  cy="164" r="8.5" fill="#1a0080"/>
      <rect id="pl-lid" x="75" y="149" width="42" height="0" rx="4" fill="#7C4DFF"/>
      <ellipse cx="150" cy="157" rx="21" ry="15" fill="white" opacity=".9"/>
      <circle id="p-r" cx="150" cy="157" r="8.5" fill="#1a0080"/>
      <rect id="pr-lid" x="129" y="142" width="42" height="0" rx="4" fill="#7C4DFF"/>
      <rect x="117" y="220" width="5" height="13" rx="2.5" fill="#5a35cc"/>
    </g>

    <g id="g-black">
      <rect x="185" y="138" width="126" height="218" rx="8" fill="#1C1C1C"/>
      <circle cx="224" cy="208" r="18" fill="white"/>
      <circle id="b-l" cx="224" cy="208" r="8" fill="#1C1C1C"/>
      <circle cx="273" cy="208" r="18" fill="white"/>
      <circle id="b-r" cx="273" cy="208" r="8" fill="#1C1C1C"/>
    </g>

    <g id="g-yellow">
      <rect x="260" y="270" width="114" height="154" rx="57" fill="#FFD93D"/>
      <circle cx="304" cy="316" r="11" fill="rgba(0,0,0,.1)"/>
      <circle id="y-e" cx="304" cy="316" r="5.5" fill="#1C1C1C"/>
      <line x1="274" y1="360" x2="326" y2="360" stroke="#1C1C1C" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- elementos medicos -->
    <g id="g-medical-cross">
      <rect x="315" y="70" width="46" height="46" rx="10" fill="#ffffff" opacity="0.95"/>
      <rect x="334" y="79" width="8" height="28" rx="3" fill="#ef4444"/>
      <rect x="324" y="89" width="28" height="8" rx="3" fill="#ef4444"/>
    </g>

    <g id="g-stetho" stroke="#1f2937" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M44 84 v42 a18 18 0 0 0 36 0 v-42" />
      <path d="M62 144 v26 a26 26 0 0 0 52 0 v-6" />
      <circle cx="122" cy="163" r="10" fill="#ffffff" />
      <circle cx="122" cy="163" r="4" fill="#1f2937" />
      <circle cx="44" cy="78" r="5" fill="#1f2937"/>
      <circle cx="80" cy="78" r="5" fill="#1f2937"/>
    </g>

    <g id="g-pill">
      <rect x="270" y="222" width="64" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <path d="M302 224 v22" stroke="#ef4444" stroke-width="2"/>
      <rect x="270" y="222" width="32" height="26" rx="13" fill="#fca5a5"/>
    </g>
  </svg>
</div>

<div class="right">
  <div class="sparkle">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="#111">
      <path d="M15 0 L16.8 12 L28 15 L16.8 18 L15 30 L13.2 18 L2 15 L13.2 12 Z"/>
    </svg>
  </div>

  <div class="form">
    <h1>Bienvenido!</h1>
    <p class="sub">Ingrese sus credenciales</p>

    <div class="field">
      <label>Email</label>
      <div class="fi">
        <input type="email" id="inp-email" placeholder="admin@demo.com"/>
      </div>
    </div>

    <div class="field">
      <label>Contraseña</label>
      <div class="fi">
        <input type="password" id="inp-pw" placeholder="Su contraseña"/>
        <button class="toggle-pw" id="pw-btn" type="button">
          <svg id="icon-open" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg id="icon-closed" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </div>

    <p class="demo">Contraseña de demo: 123456</p>
    <button class="btn-login" id="btn-login">Iniciar sesión</button>
    <p id="login-error" class="error"></p>
  </div>
</div>

<script src="login.js?v=2"></script>
</body>
</html>
