services:
  mysql:
    image: mysql:8.0
    container_name: citas_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: db_usuarios
    ports:
      - "${PORT_MYSQL:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - citas_net

  ms-usuarios:
    build: ./ms-usuarios
    container_name: ms_usuarios
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: db_usuarios
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - citas_net

  ms-especialidades:
    build: ./ms-especialidades
    container_name: ms_especialidades
    restart: unless-stopped
    environment:
      PORT: 3007
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: db_especialidades
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3007/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - citas_net

  ms-historial:
    build: ./ms-historial
    container_name: ms_historial
    restart: unless-stopped
    environment:
      PORT: 3005
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: db_historial
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - citas_net

  ms-auth:
    build: ./ms-auth
    container_name: ms_auth
    restart: unless-stopped
    environment:
      PORT: 3006
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: db_usuarios
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: ${JWT_EXPIRES:-8h}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - citas_net

  ms-citas:
    build: ./ms-citas
    container_name: ms_citas
    restart: unless-stopped
    environment:
      PORT: 3004
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: db_citas
      MS_USUARIOS_URL: http://ms-usuarios:3001
      MS_HISTORIAL_URL: http://ms-historial:3005
    depends_on:
      mysql:
        condition: service_healthy
      ms-usuarios:
        condition: service_healthy
      ms-historial:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - citas_net

  ms-disponibilidad:
    build: ./ms-disponibilidad
    container_name: ms_disponibilidad
    restart: unless-stopped
    environment:
      PORT: 3003
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: db_disponibilidad
      MS_USUARIOS_URL: http://ms-usuarios:3001
      MS_ESPECIALIDADES_URL: http://ms-especialidades:3007
      MS_CITAS_URL: http://ms-citas:3004
    depends_on:
      mysql:
        condition: service_healthy
      ms-usuarios:
        condition: service_healthy
      ms-especialidades:
        condition: service_healthy
      ms-citas:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - citas_net

  ms-gateway:
    build: ./ms-gateway
    container_name: ms_gateway
    restart: unless-stopped
    environment:
      PORT: 8080
      MS_USUARIOS_URL: http://ms-usuarios:3001
      MS_DISPONIBILIDAD_URL: http://ms-disponibilidad:3003
      MS_CITAS_URL: http://ms-citas:3004
      MS_HISTORIAL_URL: http://ms-historial:3005
      MS_ESPECIALIDADES_URL: http://ms-especialidades:3007
      MS_AUTH_URL: http://ms-auth:3006
    ports:
      - "${PORT_GATEWAY:-8080}:8080"
    depends_on:
      ms-usuarios:
        condition: service_healthy
      ms-disponibilidad:
        condition: service_healthy
      ms-citas:
        condition: service_healthy
      ms-historial:
        condition: service_healthy
      ms-especialidades:
        condition: service_healthy
      ms-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - citas_net

  ms-frontend:
    build: ./ms-frontend
    container_name: ms_frontend
    restart: unless-stopped
    ports:
      - "${PORT_FRONTEND:-80}:80"
    depends_on:
      ms-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - citas_net

networks:
  citas_net:
    driver: bridge

volumes:
  mysql_data:
