version: '3.8'

services:

  # FRONTEND: Interfaz web con Nginx 
  frontend:
    image: nginx:alpine
    container_name: biblioteca_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/html:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - biblioteca_net
    restart: unless-stopped

  # BACKEND: API REST con Node.js + Express 
  backend:
    image: node:18-alpine
    container_name: biblioteca_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && node server.js"
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=base_datos
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      base_datos:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
      - biblioteca_net
    restart: unless-stopped

  #BASE DE DATOS: PostgreSQL 15 
  base_datos:
    image: postgres:15-alpine
    container_name: biblioteca_db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - biblioteca_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # CACHÉ: Redis 7
  cache:
    image: redis:7-alpine
    container_name: biblioteca_cache
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - biblioteca_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

#REDES
networks:
  biblioteca_net:
    driver: bridge

# VOLÚMENES PERSISTENTES 
volumes:
  datos_postgres:
    driver: local
