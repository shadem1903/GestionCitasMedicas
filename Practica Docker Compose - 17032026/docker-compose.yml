version: '3.8'

services:

  frontend:
    image: nginx:alpine
    container_name: biblioteca_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/html:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - biblioteca_net
    restart: unless-stopped

  backend:
    image: node:18-alpine
    container_name: biblioteca_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && node server.js"
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_HOST=base_datos
      - DB_PORT=5432
      - DB_NAME=biblioteca_db
      - DB_USER=admin_biblioteca
      - DB_PASSWORD=Segura#2024
    depends_on:
      - base_datos
    networks:
      - biblioteca_net
    restart: unless-stopped

  base_datos:
    image: postgres:15-alpine
    container_name: biblioteca_db
    environment:
      - POSTGRES_DB=biblioteca_db
      - POSTGRES_USER=admin_biblioteca
      - POSTGRES_PASSWORD=Segura#2024
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - biblioteca_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_biblioteca -d biblioteca_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: biblioteca_cache
    ports:
      - "6379:6379"
    command: redis-server --requirepass Cache#2024
    networks:
      - biblioteca_net
    restart: unless-stopped

networks:
  biblioteca_net:
    driver: bridge

volumes:
  datos_postgres:
    driver: local
