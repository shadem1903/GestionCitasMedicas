version: "3.9"

services:

  # ─── Base de datos compartida (dev) ───────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: citas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: citas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d citas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MS-1: Gestión de Usuarios ────────────────────────────
  ms-usuarios:
    build: ./ms-usuarios
    container_name: ms_usuarios
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: admin123
      DB_NAME: citas_db
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── MS-4: Gestión de Citas ───────────────────────────────
  ms-citas:
    build: ./ms-citas
    container_name: ms_citas
    restart: unless-stopped
    environment:
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: admin123
      DB_NAME: citas_db
      MS_USUARIOS_URL: http://ms-usuarios:3001
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
